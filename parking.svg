<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Organisation du parking de la Course du Bois Barrat</title>
<desc id="desc">Schéma des trois zones de stationnement recommandées à Montesquieu-Lauragais.</desc>
<rect width="1200" height="720" fill="#f7f7f4"/>
<path d="M90 80 C250 170 300 250 330 350 S510 500 680 520 S930 470 1110 570" fill="none" stroke="#d8d3c7" stroke-width="54" stroke-linecap="round"/>
<path d="M90 80 C250 170 300 250 330 350 S510 500 680 520 S930 470 1110 570" fill="none" stroke="#fff" stroke-width="40" stroke-linecap="round"/>
<path d="M260 40 C220 170 235 270 310 350 C390 435 510 455 660 445" fill="none" stroke="#26a9e0" stroke-width="18" stroke-linecap="round"/>
<path d="M850 90 C790 210 760 310 790 420" fill="none" stroke="#72c7e8" stroke-width="18" stroke-linecap="round"/>
<g fill="#bfe8f7" stroke="#149ad1" stroke-width="5">
<rect x="215" y="95" width="190" height="72" rx="18"/>
<rect x="565" y="420" width="220" height="72" rx="18"/>
<rect x="785" y="215" width="210" height="72" rx="18"/>
</g>
<g font-family="Arial, sans-serif" fill="#111">
<text x="600" y="65" text-anchor="middle" font-size="38" font-weight="700">ORGANISATION DU PARKING</text>
<text x="310" y="142" text-anchor="middle" font-size="25" font-weight="700">1 · Montée en Serny</text>
<text x="310" y="171" text-anchor="middle" font-size="18">vers le village</text>
<text x="675" y="466" text-anchor="middle" font-size="25" font-weight="700">2 · Côte de la Négra</text>
<text x="890" y="261" text-anchor="middle" font-size="25" font-weight="700">3 · Chemin de ronde</text>
<text x="890" y="289" text-anchor="middle" font-size="18">(sol de Madame)</text>
</g>
<path d="M1040 575 l65 0 -20 -20 M1105 575 l-20 20" fill="none" stroke="#159bd3" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="625" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#159bd3">Sens privilégié de circulation</text>
<text x="600" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700">Stationnez uniquement à droite dans le sens de circulation.</text>
<text x="600" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#333">Respectez les accès aux habitations et les consignes des bénévoles.</text>
</svg>