name: Construire le plan de stationnement

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !hashFiles('parking.jpg') }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Reconstruire l'image du parking
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/parking-data
          cat parking-data/parking-01.txt parking-data/parking-02.txt parking-data/parking-03.txt parking-data/parking-04.txt parking-data/parking-05.txt parking-data/parking-06.txt > /tmp/parking.b64
          base64 -d /tmp/parking.b64 > parking.jpg
          file parking.jpg

      - name: Publier l'image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parking.jpg
          git commit -m "Ajout du plan de stationnement en image"
          git push
